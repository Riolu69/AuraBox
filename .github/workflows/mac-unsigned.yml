name: Build Mac (Unsigned Test)

on:
  workflow_dispatch:

jobs:
  build-mac:
    name: Build Unsigned Mac App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and Patch SwiftVLC dependencies
        run: |
          echo "Resolving package dependencies..."
          xcodebuild -resolvePackageDependencies -project WatchBox.xcodeproj -scheme WatchBox -derivedDataPath build_output || true

          echo "Searching and patching SwiftVLC files..."
          
          # Универсальный поиск файлов SwiftVLC в любых возможных подпапках кэша Xcode
          TRACK_FILE=$(find build_output -name "Track.swift" | grep "SwiftVLC" | head -n 1)
          if [ -n "$TRACK_FILE" ] && [ -f "$TRACK_FILE" ]; then
            echo "Patching Track.swift at: $TRACK_FILE"
            sed -i '' 's/String(validating: payload, as: UTF8.self)/String(decoding: payload, as: UTF8.self)/g' "$TRACK_FILE"
          else
            echo "Warning: Track.swift not found!"
          fi

          PIP_FILE=$(find build_output -name "PiPController.swift" | grep "SwiftVLC" | head -n 1)
          if [ -n "$PIP_FILE" ] && [ -f "$PIP_FILE" ]; then
            echo "Patching PiPController.swift at: $PIP_FILE"
            sed -i '' 's/public final class PiPController/@available(macOS 14.0, *)\npublic final class PiPController/g' "$PIP_FILE"
          else
            echo "Warning: PiPController.swift not found!"
          fi

          THUMB_FILE=$(find build_output -name "ThumbnailRequest.swift" | grep "SwiftVLC" | head -n 1)
          if [ -n "$THUMB_FILE" ] && [ -f "$THUMB_FILE" ]; then
            echo "Patching ThumbnailRequest.swift at: $THUMB_FILE"
            sed -i '' 's/private final class ThumbnailOperation/@available(macOS 14.0, *)\nprivate final class ThumbnailOperation/g' "$THUMB_FILE"
          else
            echo "Warning: ThumbnailRequest.swift not found!"
          fi

      - name: Build Mac Catalyst app
        run: |
          xcodebuild clean build \
            -project WatchBox.xcodeproj \
            -scheme WatchBox \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -configuration Release \
            -derivedDataPath build_output \
            IPHONEOS_DEPLOYMENT_TARGET=17.4 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      - name: Zip the .app for download
        run: |
          cd build_output/Build/Products/Release-maccatalyst
          zip -r SceneBox-Mac-Unsigned.zip *.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SceneBox-Mac-Unsigned
          path: build_output/Build/Products/Release-maccatalyst/SceneBox-Mac-Unsigned.zip
